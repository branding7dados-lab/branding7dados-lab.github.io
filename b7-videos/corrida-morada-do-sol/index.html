<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>1ª Corrida Morada do Sol</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-600-normal.woff2) format('woff2'); font-weight: 600; font-style: normal; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-600-italic.woff2) format('woff2'); font-weight: 600; font-style: italic; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-700-normal.woff2) format('woff2'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-700-italic.woff2) format('woff2'); font-weight: 700; font-style: italic; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-800-normal.woff2) format('woff2'); font-weight: 800; font-style: normal; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-800-italic.woff2) format('woff2'); font-weight: 800; font-style: italic; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-900-normal.woff2) format('woff2'); font-weight: 900; font-style: normal; }
  @font-face { font-family: 'Barlow Condensed'; src: url(fonts/barlow-cond-900-italic.woff2) format('woff2'); font-weight: 900; font-style: italic; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
